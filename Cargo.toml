[package]
name    = "aplec"
version = "0.1.0"
edition = "2021"

[dependencies]
iced            = { version = "0.14", features = ["tokio"] }
iced_layershell = "0.15"
tokio           = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
